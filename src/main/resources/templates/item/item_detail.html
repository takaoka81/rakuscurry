<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>カレー屋のネット注文</title>
    <link
      th:href="@{/css/bootstrap.css}"
      href="../../static/css/bootstrap.css"
      rel="stylesheet"
    />
    <link
      th:href="@{/css/curry.css}"
      href="../../static/css/curry.css"
      rel="stylesheet"
    />
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="container">
      <span th:insert="header::header"></span>
      <form th:action="@{/inCart}" method="post" th:object="${itemCartInForm}">
        <input type="hidden" name="id" th:value="${item.id}" />
        <div class="row">
          <div class="col-xs-offset-2 col-xs-8">
            <h3 class="text-center">商品詳細</h3>
            <div class="row">
              <div class="col-xs-5">
                <img
                  th:src="@{/img_curry/} + ${item.imagePath}"
                  class="img-responsive img-rounded item-img-center"
                />
                <input
                  type="hidden"
                  name="imagePath"
                  th:value="${item.imagePath}"
                />
              </div>

              <div class="col-xs-5">
                <div class="bs-component">
                  <h4 th:text="${item.name}">じゃがバターベーコン</h4>
                  <input type="hidden" name="name" th:value="${item.name}" />
                  <br />
                  <br />
                  <p th:text="${item.description}">
                    マイルドな味付けのカレーに大きくカットしたポテトをのせた、バターとチーズの風味が食欲をそそるお子様でも楽しめる商品です。
                  </p>
                </div>
              </div>
            </div>
            <br />
            <div class="row">
              <div class="col-xs-offset-2 col-xs-8">
                <div class="form-group">
                  <div class="row">
                    <div class="col-sm-12">
                      <label for="inputResponsibleCompany">サイズ</label>
                    </div>
                    <div class="col-sm-12">
                      <label class="radio-inline">
                        <input
                          type="radio"
                          name="size"
                          value="M"
                          class="size"
                          th:data-price="${item.priceM}"
                          onchange="calcTotalPrice()"
                          checked="checked"
                        />
                        <span class="price">&nbsp;М&nbsp;</span>
                        <input
                          type="hidden"
                          name="priceM"
                          th:value="${item.priceM}"
                        />
                        <span
                          th:text="${#numbers.formatInteger(item.priceM,1,'COMMA')}"
                        ></span
                        >円(税込み)
                      </label>
                      <label class="radio-inline">
                        <input
                          type="radio"
                          name="size"
                          value="L"
                          class="size"
                          th:data-price="${item.priceL}"
                          onchange="calcTotalPrice()"
                        />
                        <span class="price">&nbsp;Ｌ</span>
                        <input
                          type="hidden"
                          name="priceL"
                          th:value="${item.priceL}"
                        />
                        <span
                          th:text="${#numbers.formatInteger(item.priceL,1,'COMMA')}"
                        ></span
                        >円(税込み)
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <br />
            <div class="row">
              <div class="col-xs-offset-2 col-xs-8">
                <div class="form-group">
                  <div class="row">
                    <div class="col-sm-12">
                      <label for="inputResponsibleCompany"> トッピング </label>
                    </div>
                    <div class="col-sm-12" id="topping">
                      <div
                        th:each="topping, status : ${application.toppingList}"
                      >
                        <label class="checkbox-inline">
                          <input
                            type="checkbox"
                            class="topping-checkbox"
                            name="toppingIndex"
                            th:value="${status.index}"
                            th:data-price-m="${topping.priceM}"
                            th:data-price-l="${topping.priceL}"
                            onchange="calcTotalPrice()"
                          /><span th:text="${topping.name}"></span>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-xs-offset-2 col-xs-8">
                <div class="form-group">
                  <div class="row">
                    <div class="col-xs-5 col-sm-5">
                      <label for="">数量:</label>
                      <label
                        class="control-label"
                        style="color: red"
                        for="inputError"
                        >数量を選択してください</label
                      >
                      <select
                        name="quantity"
                        class="form-control"
                        id="currynum"
                        onchange="calcTotalPrice()"
                      >
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <br />
            <div class="row">
              <div class="col-xs-offset-2 col-xs-10">
                <div class="form-group">
                  <span id="total-price"
                    >この商品金額：<span id="totalprice"></span>&nbsp;円</span
                  >
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-xs-offset-2 col-xs-3">
                <div class="form-group">
                  <p>
                    <input
                      class="form-control btn btn-warning btn-block"
                      type="submit"
                      value="カートに入れる"
                    />
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <!-- end container -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <!--ハンバーガー機能追加-->
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script>
      "use strict";
      /**
       * 合計金額を計算して表示する関数
       */
      function calcTotalPrice() {
        // 1. 選択されたサイズの基本価格を取得
        const sizeRadio = document.querySelector('input[name="size"]:checked');
        const selectedSize = sizeRadio.value;
        const itemPrice = parseInt(sizeRadio.dataset.price, 10);

        // 2. 選択されたトッピングの合計金額を計算
        let toppingTotalPrice = 0;
        const toppingCheckboxes = document.querySelectorAll(
          ".topping-checkbox:checked",
        );

        toppingCheckboxes.forEach((checkbox) => {
          // 選択されたサイズに応じて、MかLの価格を加算する
          if (selectedSize === "M") {
            toppingTotalPrice += parseInt(checkbox.dataset.priceM, 10);
          } else {
            // 'L'
            toppingTotalPrice += parseInt(checkbox.dataset.priceL, 10);
          }
        });

        // 3. 数量を取得
        const quantity = parseInt(
          document.getElementById("currynum").value,
          10,
        );

        // 4. 最終的な合計金額を計算して表示
        const totalPrice = (itemPrice + toppingTotalPrice) * quantity;
        document.getElementById("totalprice").textContent =
          totalPrice.toLocaleString();
      }
      // ページが読み込まれた時に、初期の合計金額を計算して表示する
      window.onload = calcTotalPrice;
    </script>
  </body>
</html>
